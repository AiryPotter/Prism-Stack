<!doctype html>
<!--
  ============================================================
  Stackfall — touch-first, offline falling-block puzzle game for phones (MIT License)
  https://github.com/AiryPotter/Prism-Stack
  Single self-contained file. Works offline.
  Game modes: Marathon (Easy/Normal/Hard), 30 Stages, Sprint, Ultra,
  Daily Challenge and Zen. The rules engine below is an exact copy of
  Prism Stack's (tests check the two stay identical).
  No ads. No analytics. No trackers. No network requests.
  The only data stored is your best score, settings and any
  sound clips you add yourself, all kept on your own phone.
  Every built-in sound is synthesized in this file; nothing is downloaded.
  ============================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data: blob:; connect-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Stackfall: a free, ad-free, offline falling-block puzzle game for phones.">
<title>Stackfall</title>
<style>
:root{
  --bg:#0e0b1f; --panel:rgba(255,255,255,.05); --line:rgba(255,255,255,.10);
  --text:#ECE9FF; --muted:#9C95C9; --accent:#FFC857;
  --btn:rgba(255,255,255,.07); --btnOn:rgba(255,255,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
body{background:radial-gradient(120% 70% at 50% 0%,#2a2160 0%,var(--bg) 62%) var(--bg)}
button{font-family:inherit;color:inherit;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px)}
header{display:flex;align-items:center;justify-content:space-between;height:40px;flex:0 0 auto}
.hl,.hr{display:flex;align-items:center;gap:8px}
.brand{font-weight:900;letter-spacing:.08em;font-size:16px}
.brand span,.logo span{color:var(--accent)}
.conf{font-size:9px;letter-spacing:.14em;color:#ffb3b3;border:1px solid rgba(255,140,140,.4);
  border-radius:6px;padding:2px 6px;font-weight:700}
.iconbtn{width:42px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--btn);
  display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:20px;height:20px}

#play{flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:center;gap:10px;touch-action:none}
#boardWrap{position:relative;border-radius:14px;padding:4px;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 0 1px var(--line);transition:box-shadow .3s}
#boardWrap.danger{box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,90,110,.6),0 0 30px rgba(255,90,110,.28)}
#boardWrap.shake{animation:shake .16s ease-out}
@keyframes shake{0%{transform:translateY(0)}35%{transform:translateY(4px)}100%{transform:translateY(0)}}
#board{display:block;border-radius:10px}

#side{display:flex;flex-direction:column;gap:7px;flex:0 0 78px;width:78px;overflow:hidden}
#boardWrap{flex:0 0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 7px}
.card.tap:active{background:var(--btnOn)}
.label{font-size:9px;letter-spacing:.16em;color:var(--muted);font-weight:800;margin-bottom:3px;text-transform:uppercase}
.stat{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;white-space:nowrap}
.mini{display:block;width:100%;height:32px}
.mini.big{height:44px}
#hc{height:40px}

#pop{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0}
#pop b{display:block;font-size:28px;font-weight:900;letter-spacing:.04em;text-shadow:0 2px 18px rgba(0,0,0,.7)}
#pop small{display:block;font-size:13px;color:var(--accent);font-weight:800;margin-top:2px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#pop.go{animation:pop .95s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.06)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

#controls{flex:0 0 auto;display:flex;gap:8px;margin-top:10px}
.pad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{height:58px;border-radius:15px;border:1px solid var(--line);background:var(--btn);
  display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .06s,background .06s}
.btn svg{width:26px;height:26px}
.btn.on{background:var(--btnOn);transform:scale(.95)}
.btn.hard{background:rgba(255,200,87,.15);border-color:rgba(255,200,87,.4);color:var(--accent)}

@media (orientation:landscape) and (max-height:540px){
  #controls{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);
    margin:0;justify-content:space-between;pointer-events:none}
  .pad{flex:0 0 auto;width:190px;pointer-events:auto}
  .btn{height:52px}
  .mini{height:24px}.mini.big{height:30px}#hc{height:28px}
  #side{gap:4px}.card{padding:3px 6px}
}

#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;
  background:rgba(10,8,24,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px)}
#overlay.show{display:flex}
.sheet{width:100%;max-width:340px;max-height:100%;overflow:auto;touch-action:pan-y;
  background:linear-gradient(180deg,#241c4e,#16112f);border:1px solid var(--line);border-radius:22px;
  padding:22px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-size:32px;font-weight:900;letter-spacing:.06em}
.chips{display:flex;justify-content:center;gap:5px;margin:10px 0 4px}
.chips i{width:14px;height:14px;border-radius:4px;display:block;box-shadow:inset 0 3px 0 rgba(255,255,255,.3)}
.ttl{font-size:22px;font-weight:900;letter-spacing:.04em}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.sub b{color:var(--text)}
.big{font-size:42px;font-weight:900;font-variant-numeric:tabular-nums;margin:12px 0 0}
.newbest{color:var(--accent);font-weight:800;font-size:13px;letter-spacing:.1em;margin-top:4px}
.primary{width:100%;height:52px;border:0;border-radius:14px;background:var(--accent);color:#1b1400;font-weight:900;font-size:17px;margin-top:16px}
.secondary{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--btn);font-weight:700;font-size:15px;margin-top:10px}
.toggles{display:flex;gap:8px;margin-top:14px}
.tog{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--muted);font-size:12px;font-weight:800}
.tog.on{color:var(--text);background:var(--btnOn);border-color:rgba(255,200,87,.45)}
.howto{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px;text-align:left}
.howto b{color:var(--text)}
.confnote{margin-top:14px;font-size:10px;letter-spacing:.14em;color:#ffb3b3;opacity:.85;font-weight:700}
.slist{margin-top:14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.srow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.srow.cur{border-color:rgba(255,200,87,.55);background:rgba(255,200,87,.08)}
.semo{font-size:22px;width:28px;text-align:center;flex:0 0 auto}
.sname{flex:1;min-width:0;font-weight:800;font-size:14px;line-height:1.2}
.sname small{display:block;font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:800}
.sname em{display:block;font-style:normal;font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbtn{flex:0 0 auto;height:34px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--btn);font-weight:800;font-size:12px}
.sbtn:active{background:var(--btnOn)}
.smsg{min-height:16px;margin-top:10px;font-size:12px;color:var(--accent)}
/* ---------- game modes (menus, stages, results) ---------- */
.conf{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.warn{color:#ff6b81}
.mblock{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);text-align:left}
.mhead{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:16px}
.mhead small{font-size:12px;color:var(--muted);font-weight:700}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--btn);color:var(--muted);font-weight:800;font-size:13px}
.seg button.on{color:#1b1400;background:var(--accent);border-color:var(--accent)}
.mdesc{font-size:11px;color:var(--muted);margin-top:8px}
.mblock .primary{margin-top:10px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mbtn{min-height:62px;border-radius:14px;border:1px solid var(--line);background:var(--btn);text-align:left;padding:9px 11px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.mbtn b{font-size:15px;font-weight:900}
.mbtn small{font-size:11px;color:var(--muted);font-weight:600;line-height:1.25}
.mbtn.wide{grid-column:1/-1;background:linear-gradient(135deg,rgba(255,200,87,.16),rgba(255,255,255,.04));border-color:rgba(255,200,87,.35)}
.mbtn:active,.tile:active,.seg button:active{background:var(--btnOn)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}
.tile{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);background:var(--btn);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.tile b{font-size:18px;font-weight:900}
.tile .k{font-size:8px;letter-spacing:.1em;color:var(--muted);font-weight:800;text-transform:uppercase}
.tile .st{font-size:10px;color:rgba(255,255,255,.25);letter-spacing:1px}
.tile .st i{font-style:normal;color:var(--accent)}
.tile.done{border-color:rgba(255,200,87,.35)}
.tile.next{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,200,87,.25)}
.tile:disabled{opacity:.35}
.kind{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:var(--btn);border:1px solid var(--line)}
.kind.dig{color:#ff9fd8}.kind.timed{color:#7fd6ff}.kind.lines{color:var(--accent)}
.goal{font-size:17px;font-weight:800;margin-top:10px}
.rows{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin-top:14px;text-align:left;font-size:13px}
.rows span{color:var(--muted)}
.rows b{font-variant-numeric:tabular-nums;text-align:right}
.stars{font-size:34px;letter-spacing:6px;margin-top:8px;color:rgba(255,255,255,.18)}
.stars .on{color:var(--accent);text-shadow:0 0 16px rgba(255,200,87,.6)}
.ttl.win{color:var(--accent)}.ttl.clear{color:#7AE3C3}.ttl.fail{color:#ff6b81}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
.speed{margin-top:16px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.speed label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.04em}
.speed output{color:var(--accent);font-weight:900;text-align:right}
.speed input[type=range]{display:block;width:100%;height:40px;margin:6px 0 0;accent-color:var(--accent);touch-action:none;cursor:pointer}
.speed .ends{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hl"><div class="brand">STACK<span>FALL</span></div><div class="conf" id="badge">AD-FREE</div></div>
    <div class="hr">
      <button class="iconbtn" id="bFs" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="iconbtn" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
    </div>
  </header>

  <div id="play">
    <div id="boardWrap"><canvas id="board"></canvas><div id="pop"></div></div>
    <div id="side">
      <div class="card"><div class="label">Next</div>
        <canvas class="mini big" id="n0"></canvas><canvas class="mini" id="n1"></canvas><canvas class="mini" id="n2"></canvas></div>
      <div class="card tap" id="holdCard"><div class="label">Hold</div><canvas class="mini" id="hc"></canvas></div>
      <div class="card"><div class="label" id="sl0">Score</div><div class="stat" id="sv0">0</div></div>
      <div class="card"><div class="label" id="sl1">Lines</div><div class="stat" id="sv1">0</div></div>
      <div class="card"><div class="label" id="sl2">Level</div><div class="stat" id="sv2">1</div></div>
    </div>
  </div>

  <div id="controls">
    <div class="pad">
      <button class="btn" id="bL" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="btn" id="bD" aria-label="Soft drop"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
      <button class="btn" id="bR" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="pad">
      <button class="btn" id="bCCW" aria-label="Rotate left"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9L4 8.5"/><path d="M4 3.5v5h5"/></svg></button>
      <button class="btn" id="bCW" aria-label="Rotate right"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9L20 8.5"/><path d="M20 3.5v5h-5"/></svg></button>
      <button class="btn hard" id="bHard" aria-label="Hard drop"><svg viewBox="0 0 24 24"><path d="M6 5l6 6 6-6M6 11l6 6 6-6M5 20h14"/></svg></button>
    </div>
  </div>
</div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileIn" accept="audio/*" hidden>

<!-- =======================================================================
     GAME ENGINE — exact copy of Prism Stack's game-core script.
     Pure rules: no DOM, no timers, no storage, no network. Edit it in
     Prism Stack first, then copy it here; the tests fail if they differ.
     ======================================================================= -->
<script id="game-core">
(function (root) {
  'use strict';

  // ===================================================================
  // CONSTANTS & TUNING
  // ===================================================================
  const CONFIG = Object.freeze({
    COLS: 10,
    VISIBLE_ROWS: 20,
    HIDDEN_ROWS: 20,           // buffer above the visible field
    NEXT_COUNT: 5,
    TICK_MS: 1000 / 60,        // fixed logic step
    DAS_MS: 170,               // delayed auto shift
    ARR_MS: 50,                // auto repeat rate (0 = instant)
    SOFT_DROP_FACTOR: 20,      // soft drop = gravity × this
    LOCK_DELAY_MS: 500,
    MAX_LOCK_RESETS: 15,
    LINE_CLEAR_DELAY_MS: 200,
    LINES_PER_LEVEL: 10,
    GRAVITY_LEVEL_CAP: 20,
    SPAWN_X: 3,
  });
  const TOTAL_ROWS = CONFIG.HIDDEN_ROWS + CONFIG.VISIBLE_ROWS;

  // ===================================================================
  // TETROMINO DEFINITIONS
  // Cells are [x, y] inside the piece's SRS bounding box, y pointing down.
  // Rotation states 0, R, 2, L are generated by rotating the box clockwise.
  // Board cell values: piece letters, 'X' = junk block, 'G' = gem block.
  // ===================================================================
  const TYPES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];

  const BASE_SHAPES = {
    I: { size: 4, cells: [[0, 1], [1, 1], [2, 1], [3, 1]] },
    O: { size: 4, cells: [[1, 0], [2, 0], [1, 1], [2, 1]], fixed: true },
    T: { size: 3, cells: [[1, 0], [0, 1], [1, 1], [2, 1]] },
    S: { size: 3, cells: [[1, 0], [2, 0], [0, 1], [1, 1]] },
    Z: { size: 3, cells: [[0, 0], [1, 0], [1, 1], [2, 1]] },
    J: { size: 3, cells: [[0, 0], [0, 1], [1, 1], [2, 1]] },
    L: { size: 3, cells: [[2, 0], [0, 1], [1, 1], [2, 1]] },
  };

  function rotateCellsCW(cells, size) {
    return cells.map(([x, y]) => [size - 1 - y, x]);
  }

  const SHAPES = {};
  for (const type of TYPES) {
    const def = BASE_SHAPES[type];
    const states = [def.cells];
    for (let i = 1; i < 4; i++) {
      states.push(def.fixed ? def.cells : rotateCellsCW(states[i - 1], def.size));
    }
    SHAPES[type] = states;
  }

  // ===================================================================
  // SRS WALL KICKS
  // Offsets are [dx, dy] with +y = UP (as published). Converted when applied.
  // Key format: "from>to" using states 0=spawn, 1=R, 2=180, 3=L.
  // ===================================================================
  const KICKS_JLSTZ = {
    '0>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    '1>0': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    '1>2': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    '2>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    '2>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
    '3>2': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    '3>0': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    '0>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
  };
  const KICKS_I = {
    '0>1': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    '1>0': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    '1>2': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
    '2>1': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    '2>3': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    '3>2': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    '3>0': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    '0>3': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
  };
  // 180° rotation is not part of SRS; this small set tries in place, sideways, then up/down.
  const KICKS_180 = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]];
  const NO_KICK = [[0, 0]];

  function getKicks(type, from, to) {
    if (type === 'O') return NO_KICK;
    if ((from + 2) % 4 === to) return KICKS_180;
    const table = type === 'I' ? KICKS_I : KICKS_JLSTZ;
    return table[from + '>' + to];
  }

  // ===================================================================
  // PIECE GENERATION — 7-bag randomizer
  // ===================================================================
  // Small seeded PRNG (stages, Daily Challenge and tests use fixed seeds).
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  class Bag {
    constructor(rng) { this.rng = rng || Math.random; this.pool = []; }
    refill() {
      const a = TYPES.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(this.rng() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      this.pool = a;
    }
    next() {
      if (this.pool.length === 0) this.refill();
      return this.pool.pop();
    }
  }

  // ===================================================================
  // LEVELS & GRAVITY
  // Accepts fractional levels (used by Easy/Normal difficulty scaling).
  // ===================================================================
  function secondsPerRow(level) {
    const L = Math.min(Math.max(level, 1), CONFIG.GRAVITY_LEVEL_CAP);
    return Math.pow(0.8 - (L - 1) * 0.007, L - 1);
  }

  // ===================================================================
  // SCORING (guideline values; everything except drops is × level)
  //   Line clears, T-spins (full + mini), back-to-back ×1.5,
  //   combos (50 × combo) and perfect clears.
  // ===================================================================
  const LINE_CLEAR_POINTS = [0, 100, 300, 500, 800];
  const TSPIN_POINTS      = [400, 800, 1200, 1600];   // by lines cleared (0–3)
  const TSPIN_MINI_POINTS = [100, 200, 400];          // by lines cleared (0–2)
  const PERFECT_CLEAR_POINTS = [0, 800, 1200, 1800, 2000];
  const PERFECT_CLEAR_B2B_QUAD = 3200;
  const COMBO_POINTS = 50;
  const B2B_MULTIPLIER = 1.5;

  function scoreForLineClear(lines, level) {
    return (LINE_CLEAR_POINTS[lines] || 0) * level;
  }
  // Base points for one lock, before level, back-to-back, combo and perfect
  // clear. tspin: null | 'mini' | 'full'.
  function basePoints(lines, tspin) {
    if (tspin === 'full') return TSPIN_POINTS[lines] || 0;
    if (tspin === 'mini') return TSPIN_MINI_POINTS[lines] || 0;
    return LINE_CLEAR_POINTS[lines] || 0;
  }
  // "Difficult" clears keep a back-to-back chain going: a Quad, or any
  // T-spin (full or mini) that clears at least one line.
  function isDifficult(lines, tspin) {
    return lines >= 4 || (!!tspin && lines > 0);
  }
  // Display name for a clear, e.g. "T-SPIN DOUBLE", "MINI T-SPIN", "QUAD".
  const CLEAR_NAMES = ['', 'SINGLE', 'DOUBLE', 'TRIPLE', 'QUAD'];
  function clearName(lines, tspin) {
    if (tspin) {
      const t = tspin === 'mini' ? 'MINI T-SPIN' : 'T-SPIN';
      return lines ? t + ' ' + CLEAR_NAMES[lines] : t;
    }
    return CLEAR_NAMES[lines] || '';
  }

  // ===================================================================
  // BOARD
  // board[y][x] = null or a cell letter. Row 0 is the top of the buffer.
  // ===================================================================
  function emptyRow() { return new Array(CONFIG.COLS).fill(null); }
  function createBoard() {
    const b = [];
    for (let y = 0; y < TOTAL_ROWS; y++) b.push(emptyRow());
    return b;
  }

  // ===================================================================
  // RULES — what makes each mode different. Defaults = Marathon (Hard).
  // ===================================================================
  const DEFAULT_RULES = Object.freeze({
    id: 'marathon',
    gravityScale: 1,      // how quickly speed rises with level (0 = never)
    speedLevel: 0,        // > 0 fixes the speed at this level
    lineGoal: 0,          // win when this many lines are cleared
    gemGoal: false,       // win when every gem block is cleared
    timeLimitMs: 0,       // 0 = no time limit
    onTimeUp: 'lose',     // 'lose' (stages) or 'finish' (Ultra, Daily)
    noTopOut: false,      // Zen: wipe the board instead of game over
    secondsPerRow: 0,     // > 0: fixed fall speed (Zen practice); Infinity = blocks don't fall
    garbage: null,        // junk rows (top to bottom) placed at the bottom
    config: null,         // CONFIG overrides, e.g. { LOCK_DELAY_MS: 1000 }
  });

  // ===================================================================
  // GAME STATE MACHINE
  // state: 'playing' | 'clearing' | 'over'   (paused is a separate flag)
  // outcome (when over): 'lose' | 'win' | 'finish'
  // ===================================================================
  class Game {
    constructor(opts) {
      opts = opts || {};
      this.rules = Object.assign({}, DEFAULT_RULES, opts.rules || {});
      this.cfg = Object.assign({}, CONFIG, this.rules.config || {}, opts.config || {});
      this.rng = opts.rng || Math.random;
      this.startLevel = opts.startLevel || 1;
      this.reset();
    }

    reset() {
      this.board = createBoard();
      if (this.rules.garbage) {
        const g = this.rules.garbage;
        g.forEach((row, i) => { this.board[TOTAL_ROWS - g.length + i] = row.slice(); });
      }
      this.gemsTotal = this.countGems();
      this.bag = new Bag(this.rng);
      this.queue = [];
      this.fillQueue();
      this.piece = null;
      this.holdType = null;
      this.canHold = true;

      this.score = 0;
      this.lines = 0;
      this.level = this.startLevel;
      this.piecesPlaced = 0;
      this.b2b = false;        // last line clear was "difficult"
      this.combo = -1;         // consecutive line-clearing locks, minus one
      // clears[n] = how many n-line clears (any kind, T-spins included).
      this.stats = { tspins: 0, b2bs: 0, maxCombo: 0, perfectClears: 0, quads: 0, clears: [0, 0, 0, 0, 0] };
      this.elapsedMs = 0;
      this.zenWipes = 0;

      this.state = 'playing';
      this.paused = false;
      this.gameOverReason = null;
      this.outcome = null;

      this.gravityAcc = 0;
      this.lockTimer = 0;
      this.lockResets = 0;

      this.clearingRows = [];
      this.clearTimer = 0;

      // Held-input state for DAS/ARR and soft drop.
      this.input = { left: false, right: false, soft: false };
      this.dir = 0;
      this.dasTimer = 0;
      this.arrTimer = 0;

      this.events = [];
      this.spawn(this.takeNext());
    }

    // ----- Next queue ------------------------------------------------
    fillQueue() {
      while (this.queue.length < this.cfg.NEXT_COUNT) this.queue.push(this.bag.next());
    }
    takeNext() {
      const t = this.queue.shift();
      this.fillQueue();
      return t;
    }

    // ----- Speed -------------------------------------------------------
    // Seconds for a piece to fall one row right now.
    fallSecondsPerRow() {
      const fixed = this.rules.secondsPerRow;
      return fixed > 0 ? fixed : secondsPerRow(this.gravityLevel());
    }
    // Zen practice: change the fall speed at any time (Infinity = frozen).
    setSecondsPerRow(s) {
      this.rules.secondsPerRow = s > 0 ? s : 0;
      this.gravityAcc = 0;
    }
    gravityLevel() {
      if (this.rules.speedLevel > 0) return this.rules.speedLevel;
      return 1 + (this.level - 1) * this.rules.gravityScale;
    }

    // ----- Gems --------------------------------------------------------
    countGems(excludeRows) {
      const skip = excludeRows ? new Set(excludeRows) : null;
      let n = 0;
      for (let y = 0; y < TOTAL_ROWS; y++) {
        if (skip && skip.has(y)) continue;
        const row = this.board[y];
        for (let x = 0; x < this.cfg.COLS; x++) if (row[x] === 'G') n++;
      }
      return n;
    }

    // ----- Collision ---------------------------------------------------
    collides(type, rot, x, y) {
      const cells = SHAPES[type][rot];
      for (let i = 0; i < 4; i++) {
        const cx = x + cells[i][0];
        const cy = y + cells[i][1];
        if (cx < 0 || cx >= this.cfg.COLS || cy < 0 || cy >= TOTAL_ROWS) return true;
        if (this.board[cy][cx] !== null) return true;
      }
      return false;
    }
    cellsOf(p) {
      return SHAPES[p.type][p.rot].map(([dx, dy]) => [p.x + dx, p.y + dy]);
    }
    isOnGround() {
      const p = this.piece;
      return !!p && this.collides(p.type, p.rot, p.x, p.y + 1);
    }
    ghostY() {
      const p = this.piece;
      if (!p) return null;
      let y = p.y;
      while (!this.collides(p.type, p.rot, p.x, y + 1)) y++;
      return y;
    }

    // ----- Spawning ----------------------------------------------------
    spawn(type) {
      const p = {
        type, rot: 0,
        x: this.cfg.SPAWN_X,
        y: this.cfg.HIDDEN_ROWS - 2,   // just above the visible field
        lowestY: 0,
        lastWasRotate: false,           // for T-spin detection
        lastKick: -1,
        lastRot180: false,
      };
      this.piece = p;
      if (this.collides(type, 0, p.x, p.y)) {
        if (this.rules.noTopOut) this.zenWipe();
        else { this.endGame('blockout'); return false; }
      }
      if (!this.collides(type, 0, p.x, p.y + 1)) p.y += 1;  // drop one row on entry
      p.lowestY = p.y;
      this.gravityAcc = 0;
      this.lockTimer = 0;
      this.lockResets = 0;
      this.events.push({ type: 'spawn', piece: type });

      // DAS carry: a fully charged direction shifts the new piece right away.
      if (this.dir !== 0 && this.dasTimer >= this.cfg.DAS_MS) {
        if (this.cfg.ARR_MS <= 0) this.shiftMax(this.dir);
        else this.tryMove(this.dir, 0);
        this.arrTimer = 0;
      }
      return true;
    }

    // Zen mode: instead of game over, clear the board and keep going.
    zenWipe() {
      this.board = createBoard();
      this.zenWipes++;
      this.events.push({ type: 'zenwipe' });
    }

    // ----- Movement ----------------------------------------------------
    // Called after any successful player move/rotation.
    onManipulated(wasOnGround) {
      if (wasOnGround || this.isOnGround()) {
        this.lockResets++;
        if (this.lockResets <= this.cfg.MAX_LOCK_RESETS) this.lockTimer = 0;
      }
    }
    noteDescent() {
      const p = this.piece;
      if (p.y > p.lowestY) {
        p.lowestY = p.y;
        this.lockResets = 0;
        this.lockTimer = 0;
      }
    }
    tryMove(dx, dy) {
      const p = this.piece;
      if (!p || this.state !== 'playing') return false;
      if (this.collides(p.type, p.rot, p.x + dx, p.y + dy)) return false;
      const wasOnGround = this.isOnGround();
      p.x += dx;
      p.y += dy;
      p.lastWasRotate = false;
      if (dy > 0) this.noteDescent();
      if (dx !== 0) {
        this.onManipulated(wasOnGround);
        this.events.push({ type: 'move' });
      }
      return true;
    }
    shiftMax(dir) {
      let moved = 0;
      while (this.tryMove(dir, 0)) moved++;
      return moved;
    }

    // ----- Rotation (SRS) ---------------------------------------------
    // dir: 1 = clockwise, -1 = counter-clockwise, 2 = 180°
    tryRotate(dir) {
      const p = this.piece;
      if (!p || this.state !== 'playing') return false;
      const from = p.rot;
      const to = (((from + dir) % 4) + 4) % 4;
      const kicks = getKicks(p.type, from, to);
      const wasOnGround = this.isOnGround();
      for (let i = 0; i < kicks.length; i++) {
        const nx = p.x + kicks[i][0];
        const ny = p.y - kicks[i][1];        // table is +y up; board is +y down
        if (!this.collides(p.type, to, nx, ny)) {
          p.x = nx; p.y = ny; p.rot = to;
          p.lastWasRotate = true;
          p.lastKick = i;
          p.lastRot180 = dir === 2;
          this.noteDescent();
          this.onManipulated(wasOnGround);
          this.events.push({ type: 'rotate', kick: i });
          return true;
        }
      }
      return false;
    }

    // ----- Drops -------------------------------------------------------
    hardDrop() {
      const p = this.piece;
      if (!p || this.state !== 'playing') return;
      let d = 0;
      while (!this.collides(p.type, p.rot, p.x, p.y + 1)) { p.y++; d++; }
      if (d > 0) p.lastWasRotate = false;
      this.score += 2 * d;
      this.events.push({ type: 'harddrop', rows: d });
      this.lockPiece();
    }

    // ----- T-spin detection ---------------------------------------------
    // 3-corner rule: the last successful action was a rotation and at least
    // 3 of the 4 corners around the T's centre are blocked (walls and floor
    // count). Full if both "front" corners (the side the T points to) are
    // blocked; otherwise mini, unless the rotation used the last SRS kick
    // (a 90° turn's kick #4), which upgrades it to full.
    tSpinType(p) {
      if (!p || p.type !== 'T' || !p.lastWasRotate) return null;
      const blocked = (dx, dy) => {
        const x = p.x + dx, y = p.y + dy;
        return x < 0 || x >= this.cfg.COLS || y < 0 || y >= TOTAL_ROWS || this.board[y][x] !== null;
      };
      // Corners of the 3×3 box, centre at (1,1): TL, TR, BR, BL.
      const c = [blocked(0, 0), blocked(2, 0), blocked(2, 2), blocked(0, 2)];
      if (c.filter(Boolean).length < 3) return null;
      // Front corners by rotation: 0 = up (TL,TR), R (TR,BR), 2 = down (BR,BL), L (BL,TL).
      const front = [[0, 1], [1, 2], [2, 3], [3, 0]][p.rot];
      if (c[front[0]] && c[front[1]]) return 'full';
      if (p.lastKick === 4 && !p.lastRot180) return 'full';
      return 'mini';
    }

    // ----- Locking & line clearing ------------------------------------
    lockPiece() {
      const p = this.piece;
      if (!p) return;
      const tspin = this.tSpinType(p);   // check before the piece joins the board
      const cells = this.cellsOf(p);
      let entirelyHidden = true;
      for (const [x, y] of cells) {
        this.board[y][x] = p.type;
        if (y >= this.cfg.HIDDEN_ROWS) entirelyHidden = false;
      }
      this.piece = null;
      this.piecesPlaced++;
      this.canHold = true;
      this.events.push({ type: 'lock', cells, piece: p.type });

      if (entirelyHidden) {
        if (this.rules.noTopOut) { this.zenWipe(); this.spawn(this.takeNext()); return; }
        this.endGame('lockout');
        return;
      }

      const full = [];
      for (let y = 0; y < TOTAL_ROWS; y++) {
        if (this.board[y].every(c => c !== null)) full.push(y);
      }
      if (full.length === 0) {
        // No lines: the combo ends. A T-spin with no lines still scores,
        // but neither builds nor breaks back-to-back.
        this.combo = -1;
        if (tspin) {
          const points = basePoints(0, tspin) * this.level;
          this.score += points;
          this.stats.tspins++;
          this.events.push({ type: 'tspin', tspin, points, name: clearName(0, tspin) });
        }
        this.spawn(this.takeNext());
        return;
      }

      const n = full.length;
      const level = this.level;              // score uses the level at clear time
      const difficult = isDifficult(n, tspin);
      const b2b = difficult && this.b2b;     // continues an earlier difficult clear
      this.b2b = difficult;
      this.combo++;

      let points = basePoints(n, tspin) * level;
      if (b2b) points *= B2B_MULTIPLIER;
      if (this.combo > 0) points += COMBO_POINTS * this.combo * level;

      // Perfect clear: nothing left on the board once the full rows go.
      const fullSet = new Set(full);
      let perfect = true;
      for (let y = 0; y < TOTAL_ROWS && perfect; y++) {
        if (fullSet.has(y)) continue;
        if (this.board[y].some(c => c !== null)) perfect = false;
      }
      if (perfect) {
        points += (n === 4 && b2b ? PERFECT_CLEAR_B2B_QUAD : PERFECT_CLEAR_POINTS[n]) * level;
        this.stats.perfectClears++;
      }
      points = Math.round(points);
      this.score += points;

      if (tspin) this.stats.tspins++;
      if (b2b) this.stats.b2bs++;
      if (n === 4) this.stats.quads++;
      this.stats.clears[Math.min(n, 4)]++;
      if (this.combo > this.stats.maxCombo) this.stats.maxCombo = this.combo;

      this.lines += n;
      const newLevel = this.startLevel + Math.floor(this.lines / this.cfg.LINES_PER_LEVEL);
      if (newLevel > this.level) {
        this.level = newLevel;
        this.events.push({ type: 'levelup', level: newLevel });
      }
      this.events.push({
        type: 'clear', lines: n, rows: full, points,
        tspin, b2b, combo: this.combo, perfect, name: clearName(n, tspin),
      });

      this.clearingRows = full;
      this.clearTimer = 0;

      // Gems inside the cleared rows are collected.
      let gemsCleared = 0;
      for (const y of full) for (const c of this.board[y]) if (c === 'G') gemsCleared++;
      if (gemsCleared) {
        this.events.push({ type: 'gem', cleared: gemsCleared, left: this.countGems(full) });
      }

      // Goal reached? Finish immediately so the clock stops on this piece.
      if (this.goalReached()) {
        this.removeClearedRows();
        this.endGame('goal', 'win');
        return;
      }

      this.state = 'clearing';
      if (this.cfg.LINE_CLEAR_DELAY_MS <= 0) this.finishClear();
    }

    goalReached() {
      const r = this.rules;
      if (r.lineGoal > 0 && this.lines >= r.lineGoal) return true;
      if (r.gemGoal && this.countGems(this.clearingRows) === 0) return true;
      return false;
    }

    removeClearedRows() {
      const remove = new Set(this.clearingRows);
      const kept = this.board.filter((_, y) => !remove.has(y));
      while (kept.length < TOTAL_ROWS) kept.unshift(emptyRow());
      this.board = kept;
      this.clearingRows = [];
      this.clearTimer = 0;
    }

    finishClear() {
      this.removeClearedRows();
      this.state = 'playing';
      this.spawn(this.takeNext());
    }

    // ----- Hold --------------------------------------------------------
    hold() {
      if (this.state !== 'playing' || !this.piece || !this.canHold) return false;
      const current = this.piece.type;
      let incoming;
      if (this.holdType === null) {
        this.holdType = current;
        incoming = this.takeNext();
      } else {
        incoming = this.holdType;
        this.holdType = current;
      }
      this.canHold = false;
      this.piece = null;
      this.events.push({ type: 'hold' });
      this.spawn(incoming);
      return true;
    }

    // ----- Touch gestures (used by Stackfall) ---------------------------
    // A finger drag moves exactly one cell per step (no DAS), and a slow
    // drag down moves one row per step, scoring like soft drop (1 per row).
    nudge(dir) {
      if (this.state !== 'playing' || this.paused) return false;
      return this.tryMove(dir, 0);
    }
    softStep() {
      if (this.state !== 'playing' || this.paused) return false;
      if (!this.tryMove(0, 1)) return false;
      this.score += 1;
      this.gravityAcc = 0;
      return true;
    }

    // ----- Game over / win / finish -------------------------------------
    endGame(reason, outcome) {
      this.state = 'over';
      this.gameOverReason = reason;
      this.outcome = outcome || 'lose';
      this.events.push({ type: 'gameover', reason, outcome: this.outcome });
    }

    // ----- Input interface ---------------------------------------------
    // Actions: left, right, soft, hard, cw, ccw, r180, hold
    press(action) {
      if (this.state === 'over' || this.paused) return;
      switch (action) {
        case 'left':  this.input.left = true;  this.setDir(-1); break;
        case 'right': this.input.right = true; this.setDir(1);  break;
        case 'soft':  this.input.soft = true; break;
        case 'hard':  this.hardDrop(); break;
        case 'cw':    this.tryRotate(1); break;
        case 'ccw':   this.tryRotate(-1); break;
        case 'r180':  this.tryRotate(2); break;
        case 'hold':  this.hold(); break;
      }
    }
    release(action) {
      switch (action) {
        case 'left':
          this.input.left = false;
          if (this.dir === -1) this.handBack(this.input.right ? 1 : 0);
          break;
        case 'right':
          this.input.right = false;
          if (this.dir === 1) this.handBack(this.input.left ? -1 : 0);
          break;
        case 'soft':
          this.input.soft = false;
          break;
      }
    }
    setDir(d) {
      this.dir = d;
      this.dasTimer = 0;
      this.arrTimer = 0;
      this.tryMove(d, 0);
    }
    handBack(d) {
      this.dir = d;
      this.dasTimer = 0;
      this.arrTimer = 0;
    }
    releaseAll() {
      this.input.left = this.input.right = this.input.soft = false;
      this.dir = 0;
      this.dasTimer = 0;
      this.arrTimer = 0;
    }

    // ----- Auto shift (DAS / ARR) -------------------------------------
    updateAutoShift(dt) {
      if (this.dir === 0) return;
      const prev = this.dasTimer;
      this.dasTimer += dt;
      if (this.state !== 'playing' || !this.piece) { this.arrTimer = 0; return; }
      const DAS = this.cfg.DAS_MS, ARR = this.cfg.ARR_MS;
      if (this.dasTimer < DAS) return;
      if (ARR <= 0) { this.shiftMax(this.dir); return; }
      if (prev < DAS) {
        this.tryMove(this.dir, 0);
        this.arrTimer = this.dasTimer - DAS;
      } else {
        this.arrTimer += dt;
      }
      while (this.arrTimer >= ARR) {
        this.arrTimer -= ARR;
        if (!this.tryMove(this.dir, 0)) { this.arrTimer = 0; break; }
      }
    }

    // ----- Main tick (fixed step) -------------------------------------
    tick(dt) {
      if (this.paused || this.state === 'over') return;
      this.elapsedMs += dt;

      // Time limit (Ultra, Daily, timed stages).
      const limit = this.rules.timeLimitMs;
      if (limit > 0 && this.elapsedMs >= limit) {
        this.elapsedMs = limit;
        this.endGame('timeup', this.rules.onTimeUp === 'finish' ? 'finish' : 'lose');
        return;
      }

      this.updateAutoShift(dt);

      if (this.state === 'clearing') {
        this.clearTimer += dt;
        if (this.clearTimer >= this.cfg.LINE_CLEAR_DELAY_MS) this.finishClear();
        return;
      }
      if (!this.piece) return;

      // Gravity (accumulates fractional rows; soft drop multiplies the rate).
      const base = 1 / (this.fallSecondsPerRow() * 1000);
      const soft = this.input.soft;
      // Soft drop always works, even when blocks are frozen (at least level-1 soft speed).
      const rate = soft ? Math.max(base, 1 / 1000) * this.cfg.SOFT_DROP_FACTOR : base;
      this.gravityAcc += dt * rate;
      while (this.gravityAcc >= 1) {
        if (this.tryMove(0, 1)) {
          this.gravityAcc -= 1;
          if (soft) this.score += 1;
        } else {
          this.gravityAcc = 0;
          break;
        }
      }

      // Lock delay.
      if (this.isOnGround()) {
        this.gravityAcc = 0;
        if (this.lockResets > this.cfg.MAX_LOCK_RESETS) { this.lockPiece(); return; }
        this.lockTimer += dt;
        if (this.lockTimer >= this.cfg.LOCK_DELAY_MS) this.lockPiece();
      } else {
        this.lockTimer = 0;
      }
    }

    drainEvents() {
      const e = this.events;
      this.events = [];
      return e;
    }
  }

  // ===================================================================
  // MODES — difficulty, junk piles, stages, daily challenge
  // ===================================================================
  const DIFFICULTY = Object.freeze({
    easy:   { label: 'Easy',   gravityScale: 1 / 3, lockDelayMs: 1000, desc: 'Slow speed-up · 1 second to place pieces' },
    normal: { label: 'Normal', gravityScale: 1 / 2, lockDelayMs: 500,  desc: 'Speeds up at half the pace of Hard' },
    hard:   { label: 'Hard',   gravityScale: 1,     lockDelayMs: 500,  desc: 'Full speed · the original challenge' },
  });

  function fmtClock(ms) {
    const s = Math.round(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  // Junk pile: each row has exactly one hole, so every row can always be cleared.
  // messy = chance the hole moves column from one row to the next.
  // Gems are placed in distinct rows; the deepest is always in the bottom third.
  function makeGarbage(rows, gems, messy, rng) {
    const COLS = CONFIG.COLS;
    const out = [];
    let hole = Math.floor(rng() * COLS);
    for (let i = 0; i < rows; i++) {
      if (i > 0 && rng() < messy) {
        let h;
        do { h = Math.floor(rng() * COLS); } while (h === hole);
        hole = h;
      }
      const row = new Array(COLS).fill('X');
      row[hole] = null;
      out.push(row);
    }
    if (gems > 0) {
      const chosen = new Set();
      const bottomStart = Math.floor(rows * 2 / 3);
      chosen.add(bottomStart + Math.floor(rng() * (rows - bottomStart)));
      while (chosen.size < Math.min(gems, rows)) chosen.add(Math.floor(rng() * rows));
      for (const r of chosen) {
        const filled = [];
        out[r].forEach((c, x) => { if (c) filled.push(x); });
        out[r][filled[Math.floor(rng() * filled.length)]] = 'G';
      }
    }
    return out;
  }

  // 30 stages mixing three goal types. Speed rises every 4 stages (levels 1–8).
  //   lines: clear N lines          (stars by time)
  //   timed: clear N lines in T sec (stars by time)
  //   dig:   collect every gem      (stars by pieces used)
  const STAGE_DEFS = [
    { type: 'lines', lines: 5 },
    { type: 'dig',   rows: 3,  gems: 1, messy: 0 },
    { type: 'lines', lines: 10 },
    { type: 'dig',   rows: 4,  gems: 2, messy: 0.1 },
    { type: 'timed', lines: 10, time: 100 },
    { type: 'dig',   rows: 5,  gems: 2, messy: 0.2 },
    { type: 'lines', lines: 15 },
    { type: 'dig',   rows: 6,  gems: 3, messy: 0.25 },
    { type: 'timed', lines: 15, time: 120 },
    { type: 'dig',   rows: 8,  gems: 3, messy: 0.3 },
    { type: 'lines', lines: 20 },
    { type: 'dig',   rows: 8,  gems: 4, messy: 0.4 },
    { type: 'timed', lines: 20, time: 140 },
    { type: 'dig',   rows: 9,  gems: 4, messy: 0.45 },
    { type: 'lines', lines: 25 },
    { type: 'dig',   rows: 10, gems: 4, messy: 0.5 },
    { type: 'timed', lines: 25, time: 150 },
    { type: 'dig',   rows: 11, gems: 5, messy: 0.55 },
    { type: 'timed', lines: 30, time: 170 },
    { type: 'dig',   rows: 12, gems: 6, messy: 0.6 },
    // Stages 21–30 (Phase 5): longer goals, messier junk, faster speed.
    { type: 'lines', lines: 30 },
    { type: 'dig',   rows: 12, gems: 6, messy: 0.65 },
    { type: 'timed', lines: 30, time: 160 },
    { type: 'dig',   rows: 13, gems: 6, messy: 0.7 },
    { type: 'lines', lines: 35 },
    { type: 'dig',   rows: 13, gems: 7, messy: 0.75 },
    { type: 'timed', lines: 35, time: 180 },
    { type: 'dig',   rows: 14, gems: 7, messy: 0.8 },
    { type: 'timed', lines: 40, time: 200 },
    { type: 'dig',   rows: 14, gems: 8, messy: 0.85 },
  ];
  // Star targets. Tuned with the test bot, then loosened for humans.
  const STAR_TUNING = { msPerLine: 5000, timedFraction: 0.6, digPerRow: 2.5, digPerMessy: 1.6, digExtra: 2, twoStar: 1.5 };

  function buildStage(d, n) {
    const T = STAR_TUNING;
    const speed = 1 + Math.floor((n - 1) / 4);
    const st = { n, type: d.type, speed, seed: 1000 + n, def: d };
    const rules = { id: 'stage', speedLevel: speed };
    if (d.type === 'dig') {
      const garbage = makeGarbage(d.rows, d.gems, d.messy, mulberry32(7000 + n));
      let deepest = 0;
      garbage.forEach((row, i) => { if (row.includes('G')) deepest = i; });
      rules.garbage = garbage;
      rules.gemGoal = true;
      st.kind = 'Dig';
      st.goalText = 'Dig out all ' + d.gems + (d.gems > 1 ? ' gems' : ' gem');
      st.metric = 'pieces';
      st.par3 = Math.ceil((deepest + 1) * (T.digPerRow + d.messy * T.digPerMessy)) + T.digExtra;
      st.par2 = Math.floor(st.par3 * T.twoStar);
    } else {
      rules.lineGoal = d.lines;
      st.metric = 'time';
      if (d.type === 'timed') {
        rules.timeLimitMs = d.time * 1000;
        rules.onTimeUp = 'lose';
        st.kind = 'Timed';
        st.goalText = 'Clear ' + d.lines + ' lines in ' + fmtClock(d.time * 1000);
        st.par3 = Math.round(d.time * T.timedFraction) * 1000;
      } else {
        st.kind = 'Lines';
        st.goalText = 'Clear ' + d.lines + ' lines';
        st.par3 = d.lines * T.msPerLine;
      }
      st.par2 = Math.round(st.par3 * T.twoStar / 1000) * 1000;
      if (rules.timeLimitMs) st.par2 = Math.min(st.par2, rules.timeLimitMs);
    }
    st.par3Text = st.metric === 'pieces' ? st.par3 + ' pieces or fewer' : fmtClock(st.par3) + ' or faster';
    st.par2Text = st.metric === 'pieces' ? st.par2 + ' pieces or fewer' : fmtClock(st.par2) + ' or faster';
    st.rules = rules;
    return st;
  }
  const STAGES = STAGE_DEFS.map((d, i) => buildStage(d, i + 1));

  // 3 stars at or under par, 2 within 1.5× par, 1 for any clear.
  function starsFor(stage, g) {
    if (g.outcome !== 'win') return 0;
    const v = stage.metric === 'pieces' ? g.piecesPlaced : g.elapsedMs;

  }

  // Daily Challenge: the date picks the seed, so the same day = same puzzle.
  function dailySeed(dateKey) {
    let h = 2166136261;
    const s = 'prism-daily:' + dateKey;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  // Turn a menu choice into game rules plus an optional fixed seed.
  function buildMode(s) {
    switch (s.mode) {
      case 'marathon': {
        const d = DIFFICULTY[s.difficulty] || DIFFICULTY.hard;
        return { seed: null, rules: { id: 'marathon', gravityScale: d.gravityScale, config: { LOCK_DELAY_MS: d.lockDelayMs } } };
      }
      case 'sprint': return { seed: null, rules: { id: 'sprint', gravityScale: 0, lineGoal: 40 } };
      case 'ultra':  return { seed: null, rules: { id: 'ultra', gravityScale: 0.5, timeLimitMs: 120000, onTimeUp: 'finish' } };
      case 'zen':    return { seed: null, rules: { id: 'zen', gravityScale: 0, noTopOut: true,
                                                   secondsPerRow: s.secondsPerRow > 0 ? s.secondsPerRow : 0 } };
      case 'daily': {
        const seed = dailySeed(s.date);
        return { seed, rules: {
          id: 'daily', gravityScale: 0.5, timeLimitMs: 180000, onTimeUp: 'finish',
          garbage: makeGarbage(4, 0, 0.35, mulberry32(seed ^ 0x5bd1e995)),
        } };
      }
      case 'stage': {
        const st = STAGES[s.stage - 1];
        if (!st) throw new Error('No such stage: ' + s.stage);
        return { seed: st.seed, rules: st.rules };
      }
    }
    throw new Error('Unknown mode: ' + s.mode);
  }

  // extra (optional): player settings that don't change a mode's rules —
  //   config: { DAS_MS, ARR_MS, SOFT_DROP_FACTOR }, startLevel (Marathon).
  function createGame(s, extra) {
    const m = buildMode(s);
    extra = extra || {};
    return new Game({
      rng: m.seed == null ? Math.random : mulberry32(m.seed), rules: m.rules,
      config: extra.config, startLevel: extra.startLevel,
    });
  }

  root.PrismCore = {
    CONFIG, TOTAL_ROWS, TYPES, SHAPES,
    KICKS_JLSTZ, KICKS_I, KICKS_180, getKicks,
    Bag, mulberry32, secondsPerRow, scoreForLineClear, LINE_CLEAR_POINTS,
    TSPIN_POINTS, TSPIN_MINI_POINTS, PERFECT_CLEAR_POINTS, PERFECT_CLEAR_B2B_QUAD,
    COMBO_POINTS, B2B_MULTIPLIER, basePoints, isDifficult, clearName,

  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/* =======================================================================
   STACKFALL — touch layer, look, sounds and screens.
   Game rules come from the engine above (window.PrismCore), the same
   engine Prism Stack uses, so every mode plays by identical rules.
   ======================================================================= */
(function(){
'use strict';
var P=window.PrismCore, CONFIG=P.CONFIG, STAGES=P.STAGES, DIFFICULTY=P.DIFFICULTY, SHAPES=P.SHAPES;

/* ---------- constants ---------- */
var COLS=CONFIG.COLS, VIS=CONFIG.VISIBLE_ROWS, HIDDEN=CONFIG.HIDDEN_ROWS, TOTAL=P.TOTAL_ROWS;
var DAS=160, ARR=45, STEP=CONFIG.TICK_MS;
var COLORS={I:'#FF7A6B',O:'#7AE3C3',T:'#FFC857',S:'#6FA8FF',Z:'#C58BFF',J:'#FF8FC7',L:'#B6E36A',X:'#5d5785',G:'#FF5FD2'};
var TYPES=['I','O','T','S','Z','J','L'];

/* ---------- storage (local only) ---------- */
var store={
  get:function(k,d){try{var v=localStorage.getItem('stackfall.'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem('stackfall.'+k,JSON.stringify(v));}catch(e){}}
};
var settings={ghost:true,haptics:true,sound:true};
var saved=store.get('settings',{}); for(var k in saved) if(k in settings) settings[k]=!!saved[k];
function obj(v){return v&&typeof v==='object'?v:{};}
function loadSave(){
  var s=obj(store.get('save',null));
  s.best=obj(s.best); s.stages=obj(s.stages); s.stages.stars=obj(s.stages.stars); s.prefs=obj(s.prefs); s.daily=obj(s.daily);
  if(!DIFFICULTY[s.prefs.difficulty])s.prefs.difficulty='normal';
  // Best score from the single-mode build (it ran at full speed, like Hard).
  var old=Number(store.get('best',0))||0;
  if(old>(s.best['marathon-hard']||0))s.best['marathon-hard']=old;

}
var save=loadSave();

function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ---------- Zen practice speed ----------

var ZEN_MAX=100, ZEN_DEFAULT=36;   // 36 ≈ 1 row per second (level 1)
function zenValue(){var v=Number(save.prefs.zenSpeed);return isFinite(v)&&v>=0&&v<=ZEN_MAX?Math.round(v):ZEN_DEFAULT;}
function zenSpr(v){

}
function zenLabel(v){
  if(v<=0)return 'Frozen · blocks don’t fall';
  if(v>=ZEN_MAX)return 'Instant · as fast as possible';
  var s=zenSpr(v);
  if(s>=1)return '1 row every '+(s<9.95?s.toFixed(1):'10')+' s';
  var r=1/s; return (r<10?r.toFixed(1):Math.round(r))+' rows / second';
}
function zenShort(v){
  if(v<=0)return 'Frozen'; if(v>=ZEN_MAX)return 'Instant';
  var s=zenSpr(v); return s>=1?s.toFixed(1)+'s/row':(1/s<10?(1/s).toFixed(1):Math.round(1/s))+'/s';
}
function speedHTML(){
  var v=zenValue();
  return '<div class="speed"><label for="zenSpeed">Fall speed <output id="zenOut">'+zenLabel(v)+'</output></label>'+
    '<input type="range" id="zenSpeed" min="0" max="'+ZEN_MAX+'" step="1" value="'+v+'" aria-label="Fall speed">'+
    '<div class="ends"><span>Frozen</span><span>Slow</span><span>Fast</span><span>Instant</span></div></div>';
}

/* ---------- formatting ---------- */
function clock(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

function clockMs(ms){var cs=Math.floor(ms/10),s=Math.floor(cs/100);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'.'+String(cs%100).padStart(2,'0');}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n);}
function tc(s){return String(s).toLowerCase().replace(/(^|[\s-])([a-z])/g,function(m,a,b){return a+b.toUpperCase();});}

/* ---------- DOM ---------- */
function $(id){return document.getElementById(id);}
var cv=$('board'), ctx=cv.getContext('2d'), play=$('play'), side=$('side'), wrap=$('boardWrap');
var overlay=$('overlay'), sheet=$('sheet'), popEl=$('pop'), badgeEl=$('badge');
var minis=[$('n0'),$('n1'),$('n2')], holdCv=$('hc');
var slotL=[$('sl0'),$('sl1'),$('sl2')], slotV=[$('sv0'),$('sv1'),$('sv2')];

/* ---------- state ---------- */
// state: menu | playing | paused | ending | result   (screens in between use 'menu')
var game=null, session=null, state='menu', softHeld=false, acc=0, endingAt=0, introStage=1;
var cell=24, dpr=1, cache={}, bgCanvas=null, dirtyUI=true;

function modeTag(s){
  switch(s.mode){
    case 'marathon':return 'Marathon · '+DIFFICULTY[s.difficulty].label;
    case 'sprint':return 'Sprint · 40';
    case 'ultra':return 'Ultra · 2 min';
    case 'daily':return 'Daily · '+todayLabel();
    case 'zen':return 'Zen practice · '+zenShort(zenValue());
    case 'stage':return 'Stage '+s.stage+' · '+STAGES[s.stage-1].kind;
  }

}

/* ---------- actions (touch, buttons and keys all come through here) ---------- */
function canAct(){return state==='playing'&&game&&game.piece&&game.state==='playing'&&!game.paused;}
function move(dx){return canAct()?game.nudge(dx):false;}
function softStep(){return canAct()?game.softStep():false;}
function rotate(dir){return canAct()?game.tryRotate(dir):false;}
function hardDrop(){if(canAct())game.hardDrop();}
function doHold(){if(canAct())game.hold();}
function setSoft(on){
  if(!game)return;
  if(on&&state==='playing'){game.press('soft');softHeld=true;}
  else if(!on&&softHeld){game.release('soft');softHeld=false;}
}

/* ---------- game flow ---------- */
function startSession(s){
  session=s; game=P.createGame(s); state='playing'; acc=0; softHeld=false;
  hideOverlay(); badgeEl.textContent=modeTag(s); dirtyUI=true; danger();
  popEl.classList.remove('go'); popEl.textContent='';   // no leftover message from the last game
  last=performance.now(); initAudio(); reqWake(); guardBack();
}
function playMode(m){
  if(m==='marathon')startSession({mode:m,difficulty:save.prefs.difficulty});
  else if(m==='daily')startSession({mode:m,date:todayKey()});
  else if(m==='zen')startSession({mode:m,secondsPerRow:zenSpr(zenValue())});
  else startSession({mode:m});
}
function retry(){
  if(!session)return;
  if(session.mode==='zen')playMode('zen');   // use the slider's current speed
  else startSession(Object.assign({},session));
}
function toMenu(){
  game=null; session=null; state='menu'; softHeld=false; relWake();
  badgeEl.textContent='AD-FREE'; dirtyUI=true; danger(); showOverlay('menu');
}
function pause(){
  if(state!=='playing'||!game)return;
  state='paused'; game.paused=true; game.releaseAll(); softHeld=false; relWake(); showOverlay('pause');
}
function resume(){
  if(state!=='paused'||!game)return;
  state='playing'; game.paused=false; game.releaseAll(); acc=0; hideOverlay(); last=performance.now(); reqWake();
}
function danger(){
  var top=TOTAL;
  if(game){for(var y=0;y<TOTAL;y++){if(game.board[y].some(Boolean)){top=y;break;}}}

function shake(){wrap.classList.remove('shake');void wrap.offsetWidth;wrap.classList.add('shake');}

/* ---------- engine events -> sound, vibration, popups ---------- */
function handleEvents(){

      case 'rotate':sfx('rotate');buzz(4);break;
      case 'harddrop':sfx('drop');buzz(14);shake();break;
      case 'hold':sfx('hold');buzz(6);break;
      case 'lock':locked=true;break;
      case 'levelup':lvl=e.level;break;
      case 'tspin':pop(tc(e.name)+'!','');sfx('sparkle');buzz(10);break;

        cleared=true;
        var big=e.perfect||e.tspin||e.lines===4, subs=[], title=tc(e.name)+(e.lines===4||e.tspin?'!':'');
        if(e.perfect){subs.push(tc(e.name));title='Perfect Clear!';}

        if(e.combo>0)subs.push('Combo ×'+e.combo);
        var mi=memeIndex(game.level);
        if(lvl)subs.push('Level '+lvl+' · '+MEMES[mi].emoji+' '+MEMES[mi].name);
        pop(title,subs.join(' · '));

        buzz(big?[22,40,22]:16);

      case 'gem':pop(e.left?'Gem!':'All gems!',e.left?e.left+' left':'');sfx('sparkle');break;
      case 'zenwipe':pop('Fresh start','Zen never ends');break;

}

function update(dt){
  if(state==='playing'&&game){

    handleEvents();
    if(game.state==='over')beginEnding();
  }else if(state==='ending'&&performance.now()>=endingAt){

  }
}

// Short beat between the last move and the results card.

  game.releaseAll(); softHeld=false; state='ending'; relWake();
  var o=game.outcome;

    var lastStage=session.mode==='stage'&&session.stage===STAGES.length;

    pop("Time's up!",''); sfx('sparkle'); buzz([20,40,20]);

    sfx('over'); buzz([40,60,90]);

/* ---------- results ---------- */
function finishGame(){

        R.title='Finished!'; R.cls='clear'; R.sub='40 lines cleared'; R.big=clockMs(g.elapsedMs);
        R.badge=sb?'NEW BEST':'';
        R.rows=[['Pieces',g.piecesPlaced],['Pieces / sec',(g.piecesPlaced/Math.max(1,g.elapsedMs/1000)).toFixed(2)],['Best',clockMs(save.best.sprint)]];
      }else{
        R.sub=g.lines+' of 40 lines';
        R.rows=[['Lines',g.lines],['Time',clockMs(g.elapsedMs)],['Best',save.best.sprint?clockMs(save.best.sprint):'—']];

    }
    case 'ultra': case 'daily':{
      var daily=s.mode==='daily', ib;

        if(save.daily.date!==s.date)save.daily={date:s.date,score:0};
        ib=g.score>(save.daily.score||0); if(ib)save.daily.score=g.score;
      }else{ib=g.score>(save.best.ultra||0); if(ib)save.best.ultra=g.score;}
      R.title=g.outcome==='finish'?"Time's up!":'Game over'; R.cls=g.outcome==='finish'?'clear':'';
      R.sub=daily?'Daily Challenge · '+todayLabel():'Ultra · 2 minutes'; R.big=fmt(g.score);
      R.badge=ib&&g.score>0?(daily?"TODAY'S BEST":'NEW BEST'):'';

    }

      R.rows=[['Lines',g.lines],['Pieces',g.piecesPlaced],['Time',clock(g.elapsedMs)]];
      R.buttons=again; break;
    }
    case 'stage':{
      var st=STAGES[s.stage-1], lastSt=s.stage===STAGES.length;
      if(g.outcome==='win'){
        var stars=P.starsFor(st,g), prev=stageStars(s.stage);
        if(stars>prev)save.stages.stars[s.stage]=stars;
        R.title=lastSt?'You win!':'Stage clear!'; R.cls=lastSt?'win':'clear';
        R.sub=lastSt?'All '+STAGES.length+' stages cleared!':'Stage '+s.stage+' · '+st.goalText;
        R.stars=stars; R.badge=prev&&stars>prev?'NEW BEST':'';
        R.rows=[['Time',clock(g.elapsedMs)],['Pieces',g.piecesPlaced],['Score',fmt(g.score)],['★★★ target',st.par3Text]];
        R.buttons=lastSt?[['Stages','stages',1],['Retry','retry'],['Main menu','menu']]

        R.hint=lastSt?(totalStars()===STAGES.length*3?'Perfect — every stage at ★★★!':'Go back for ★★★ on every stage.')
                     :(stars<3?'Beat the ★★★ target to earn all three stars.':'');
      }else{

        var progress=st.type==='dig'?['Gems left',g.countGems()+' of '+g.gemsTotal]
                                    :['Lines',Math.min(g.lines,g.rules.lineGoal)+' of '+g.rules.lineGoal];
        R.rows=[progress,['Time',clock(g.elapsedMs)],['Pieces',g.piecesPlaced]];
        R.buttons=[['Retry','retry',1],['Stages','stages']];

    }
  }
  persist();
  showOverlay('result',R);
}

/* ---------- update / render ---------- */
function hex(c){return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)];}
function mix(c,w,a){var h=hex(c),t=w?255:0;return 'rgb('+h.map(function(v){return Math.round(v+(t-v)*a);}).join(',')+')';}
function rr(c,x,y,w,h,r){w=Math.max(0,w);h=Math.max(0,h);r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function hud(){
  var g=game, s=session;
  if(!g||!s)return [['Score','0'],['Lines','0'],['Level','1']];
  var r=g.rules, left=r.timeLimitMs?Math.max(0,r.timeLimitMs-g.elapsedMs):0;
  var leftCell=['Time left',clockDown(left),left<=10000];
  var lvl=['Level',g.level+' '+MEMES[memeIndex(g.level)].emoji];
  switch(s.mode){
    case 'marathon':return [['Score',fmt(g.score)],['Lines',g.lines],lvl];
    case 'sprint':return [['Lines left',Math.max(0,40-g.lines)],['Time',clockMs(g.elapsedMs)],['Pieces',g.piecesPlaced]];
    case 'ultra':case 'daily':return [['Score',fmt(g.score)],leftCell,['Lines',g.lines]];
    case 'zen':return [['Score',fmt(g.score)],['Lines',g.lines],['Speed',zenShort(zenValue())]];
    case 'stage':{
      var st=STAGES[s.stage-1];
      var goal=st.type==='dig'?['Gems','◆ '+g.countGems()+' left']:['Lines',Math.min(g.lines,r.lineGoal)+' / '+r.lineGoal];

// Pre-render every sound once at start-up so playback is cheap and all sounds are similarly loud.
var memeBufs=[], memeRendered=0;
function renderMemes(){
  var OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext; if(!OAC)return;
  MEMES.forEach(function(m,i){
    try{
      var sr=44100, oc=new OAC(1,Math.ceil(sr*(m.dur+0.3)),sr), prevAc=ac, prevN=noiseBuf;
      ac=oc; noiseBuf=makeNoise(oc);
      m.fn(0.02,oc.destination);
      ac=prevAc; noiseBuf=prevN;
      var done=function(buf){normalize(buf);memeBufs[i]=buf;memeRendered++;};
      var p=oc.startRendering(); if(p&&p.then)p.then(done).catch(function(){}); else oc.oncomplete=function(ev){done(ev.renderedBuffer);};
    }catch(e){ac=null;}
  });
}
function normalize(buf){
  var d=buf.getChannelData(0), n=d.length, w=Math.floor(buf.sampleRate*0.05), peak=0, maxRms=0, i, j;
  for(i=0;i<n;i++){var a=Math.abs(d[i]);if(a>peak)peak=a;}
  for(i=0;i+w<=n;i+=w>>1){var s=0;for(j=i;j<i+w;j++)s+=d[j]*d[j];var r=Math.sqrt(s/w);if(r>maxRms)maxRms=r;}
  if(!peak||!maxRms)return;
  var k=Math.min(0.24/maxRms,0.92/peak);
  for(i=0;i<n;i++)d[i]*=k;
  var fade=Math.min(n,Math.floor(buf.sampleRate*0.02));for(i=0;i<fade;i++)d[n-1-i]*=i/fade;
}

    try{old.gain.cancelScheduledValues(t);old.gain.setValueAtTime(old.gain.value,t);old.gain.linearRampToValueAtTime(0,t+0.06);}catch(e){}
    setTimeout(function(){try{old.disconnect();}catch(e){}},400);}
  var bus=actx.createGain(); bus.gain.value=1; bus.connect(master); memeBus=bus;
  var buf=customBuf[i]||memeBufs[i];
  if(buf){
    var s=actx.createBufferSource(); s.buffer=buf; s.connect(bus); s.start(t);
    if(customBuf[i]){s.stop(t+CLIP_MAX); bus.gain.setValueAtTime(1,t+CLIP_MAX-0.2); bus.gain.linearRampToValueAtTime(0,t+CLIP_MAX);}

}

  if(gs.axis==='h'){
    d=e.clientX-gs.ax;
    while(d>=step){move(1);gs.ax+=step;d-=step;gs.moved=true;}
    while(d<=-step){move(-1);gs.ax-=step;d+=step;gs.moved=true;}
  }else if(gs.axis==='v'){
    d=e.clientY-gs.ay;
    while(d>=step){softStep();gs.ay+=step;d-=step;gs.moved=true;}
    if(!gs.held&&tdy<-step*2.2){doHold();gs.held=true;gs.moved=true;}
  }
});
play.addEventListener('pointerup',function(e){
  if(!gs||e.pointerId!==gs.id)return;
  var g=gs; gs=null; if(state!=='playing')return;
  var now=performance.now(), dt=now-g.t0, tdx=e.clientX-g.x0, tdy=e.clientY-g.y0;
  if(!g.moved&&dt<350&&Math.sqrt(tdx*tdx+tdy*tdy)<14){rotate(1);return;}
  if(g.axis==='v'&&tdy>0){
    var s0=g.samples[0];
    for(var i=0;i<g.samples.length;i++){if(now-g.samples[i][0]<=90){s0=g.samples[i];break;}}
    var vy=(e.clientY-s0[1])/Math.max(1,now-s0[0]);
    if(vy>0.9&&tdy>cell*1.2)hardDrop();
  }
});
play.addEventListener('pointercancel',function(){gs=null;});

$('holdCard').addEventListener('pointerdown',function(e){e.stopPropagation();e.preventDefault();doHold();});

/* ---------- on-screen buttons ---------- */
function bind(id,onDown,onUp,repeat){
  var el=$(id), t1=0, t2=0, active=false;
  function end(){if(!active)return;active=false;el.classList.remove('on');clearTimeout(t1);clearInterval(t2);if(onUp)onUp();}
  el.addEventListener('pointerdown',function(e){
    e.preventDefault(); e.stopPropagation();
    if(state!=='playing')return;
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    active=true; el.classList.add('on'); onDown();
    if(repeat){t1=setTimeout(function(){t2=setInterval(onDown,ARR);},DAS);}
  });
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end); el.addEventListener('lostpointercapture',end);
}
bind('bL',function(){move(-1);},null,true);
bind('bR',function(){move(1);},null,true);
bind('bD',function(){softStep();setSoft(true);},function(){setSoft(false);});
bind('bCCW',function(){rotate(-1);});
bind('bCW',function(){rotate(1);});
bind('bHard',function(){hardDrop();});

$('bPause').addEventListener('click',function(){if(state==='paused')resume();else pause();});
var fsBtn=$('bFs'), de=document.documentElement;
if(!de.requestFullscreen&&!de.webkitRequestFullscreen)fsBtn.style.display='none';
fsBtn.addEventListener('click',function(){
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{var p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:'hide'}); if(p&&p.catch)p.catch(function(){});}
  }catch(e){}
});

/* ---------- keyboard (for testing on a computer) ---------- */
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(state!=='playing'&&state!=='paused'){
    if(k==='Enter'&&overlay.classList.contains('show')){var pb=sheet.querySelector('.primary');if(pb){e.preventDefault();initAudio();pb.click();}}
    return;
  }
  if(k==='p'||k==='P'||k==='Escape'){e.preventDefault();if(state==='paused')resume();else pause();return;}
  if(state!=='playing')return;
  switch(k){
    case 'ArrowLeft':move(-1);break;
    case 'ArrowRight':move(1);break;
    case 'ArrowDown':if(!e.repeat){softStep();setSoft(true);}break;
    case 'ArrowUp':case 'x':case 'X':if(!e.repeat)rotate(1);break;
    case 'z':case 'Z':if(!e.repeat)rotate(-1);break;
    case ' ':if(!e.repeat)hardDrop();break;
    case 'c':case 'C':case 'Shift':doHold();break;
    default:return;
  }
  e.preventDefault();
});
window.addEventListener('keyup',function(e){if(e.key==='ArrowDown')setSoft(false);});

/* ---------- system events ---------- */
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('visibilitychange',function(){if(document.hidden)pause();});
window.addEventListener('resize',requestLayout);
window.addEventListener('orientationchange',requestLayout);
document.addEventListener('fullscreenchange',requestLayout);
// Android back button pauses the game instead of leaving the page
var backGuarded=false;
function guardBack(){if(backGuarded)return;try{history.pushState({sf:1},'');backGuarded=true;}catch(e){}}
window.addEventListener('popstate',function(){
  backGuarded=false;
  if(state==='playing'){pause();guardBack();}
});

/* ---------- boot ---------- */
layout(); showOverlay('menu'); requestAnimationFrame(frame);
renderMemes();
openDB(function(){dbLoad(function(){decodeAllCustom();refreshSounds();});});
// Test hook (read-only views + the same actions the touch layer uses).
window.__sf={get state(){return state;},get game(){return game;},get cell(){return cell;},
  move:move,rotate:rotate,hardDrop:hardDrop,doHold:doHold,softStep:softStep,
  step:function(ms){update(ms);render(performance.now());drawStats();drawSide();}, // advance time (tests)
  memes:MEMES.map(function(m){return m.name;}),get rendered(){return memeRendered;}};
})();
</script>
