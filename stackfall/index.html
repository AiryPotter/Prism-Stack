<!doctype html>

  https://github.com/AiryPotter/Prism-Stack
  Single self-contained file. Works offline.
  No ads. No analytics. No trackers. No network requests.
  The only data stored is your best score, settings and any
  sound clips you add yourself, all kept on your own phone.
  Every built-in sound is synthesized in this file; nothing is downloaded.
  ============================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Stackfall: a free, ad-free, offline falling-block puzzle game for phones.">
<title>Stackfall</title>
<style>
:root{
  --bg:#0e0b1f; --panel:rgba(255,255,255,.05); --line:rgba(255,255,255,.10);
  --text:#ECE9FF; --muted:#9C95C9; --accent:#FFC857;
  --btn:rgba(255,255,255,.07); --btnOn:rgba(255,255,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
body{background:radial-gradient(120% 70% at 50% 0%,#2a2160 0%,var(--bg) 62%) var(--bg)}
button{font-family:inherit;color:inherit;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px)}
header{display:flex;align-items:center;justify-content:space-between;height:40px;flex:0 0 auto}
.hl,.hr{display:flex;align-items:center;gap:8px}
.brand{font-weight:900;letter-spacing:.08em;font-size:16px}
.brand span,.logo span{color:var(--accent)}
.conf{font-size:9px;letter-spacing:.14em;color:#ffb3b3;border:1px solid rgba(255,140,140,.4);
  border-radius:6px;padding:2px 6px;font-weight:700}
.iconbtn{width:42px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--btn);
  display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:20px;height:20px}

#play{flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:center;gap:10px;touch-action:none}
#boardWrap{position:relative;border-radius:14px;padding:4px;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 0 1px var(--line);transition:box-shadow .3s}
#boardWrap.danger{box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,90,110,.6),0 0 30px rgba(255,90,110,.28)}
#boardWrap.shake{animation:shake .16s ease-out}
@keyframes shake{0%{transform:translateY(0)}35%{transform:translateY(4px)}100%{transform:translateY(0)}}
#board{display:block;border-radius:10px}

#side{display:flex;flex-direction:column;gap:7px;flex:0 0 78px;width:78px;overflow:hidden}
#boardWrap{flex:0 0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 7px}
.card.tap:active{background:var(--btnOn)}
.label{font-size:9px;letter-spacing:.16em;color:var(--muted);font-weight:800;margin-bottom:3px;text-transform:uppercase}
.stat{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;white-space:nowrap}
.mini{display:block;width:100%;height:32px}
.mini.big{height:44px}
#hc{height:40px}

#pop{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0}
#pop b{display:block;font-size:28px;font-weight:900;letter-spacing:.04em;text-shadow:0 2px 18px rgba(0,0,0,.7)}
#pop small{display:block;font-size:13px;color:var(--accent);font-weight:800;margin-top:2px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#pop.go{animation:pop .95s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.06)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

#controls{flex:0 0 auto;display:flex;gap:8px;margin-top:10px}
.pad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{height:58px;border-radius:15px;border:1px solid var(--line);background:var(--btn);
  display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .06s,background .06s}
.btn svg{width:26px;height:26px}
.btn.on{background:var(--btnOn);transform:scale(.95)}
.btn.hard{background:rgba(255,200,87,.15);border-color:rgba(255,200,87,.4);color:var(--accent)}

@media (orientation:landscape) and (max-height:540px){
  #controls{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);
    margin:0;justify-content:space-between;pointer-events:none}
  .pad{flex:0 0 auto;width:190px;pointer-events:auto}
  .btn{height:52px}
  .mini{height:24px}.mini.big{height:30px}#hc{height:28px}
  #side{gap:4px}.card{padding:3px 6px}
}

#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;
  background:rgba(10,8,24,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px)}
#overlay.show{display:flex}
.sheet{width:100%;max-width:340px;max-height:100%;overflow:auto;touch-action:pan-y;
  background:linear-gradient(180deg,#241c4e,#16112f);border:1px solid var(--line);border-radius:22px;
  padding:22px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-size:32px;font-weight:900;letter-spacing:.06em}
.chips{display:flex;justify-content:center;gap:5px;margin:10px 0 4px}
.chips i{width:14px;height:14px;border-radius:4px;display:block;box-shadow:inset 0 3px 0 rgba(255,255,255,.3)}
.ttl{font-size:22px;font-weight:900;letter-spacing:.04em}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.sub b{color:var(--text)}
.big{font-size:42px;font-weight:900;font-variant-numeric:tabular-nums;margin:12px 0 0}
.newbest{color:var(--accent);font-weight:800;font-size:13px;letter-spacing:.1em;margin-top:4px}
.primary{width:100%;height:52px;border:0;border-radius:14px;background:var(--accent);color:#1b1400;font-weight:900;font-size:17px;margin-top:16px}
.secondary{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--btn);font-weight:700;font-size:15px;margin-top:10px}
.toggles{display:flex;gap:8px;margin-top:14px}
.tog{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--muted);font-size:12px;font-weight:800}
.tog.on{color:var(--text);background:var(--btnOn);border-color:rgba(255,200,87,.45)}
.howto{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px;text-align:left}
.howto b{color:var(--text)}
.confnote{margin-top:14px;font-size:10px;letter-spacing:.14em;color:#ffb3b3;opacity:.85;font-weight:700}
.slist{margin-top:14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.srow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.srow.cur{border-color:rgba(255,200,87,.55);background:rgba(255,200,87,.08)}
.semo{font-size:22px;width:28px;text-align:center;flex:0 0 auto}
.sname{flex:1;min-width:0;font-weight:800;font-size:14px;line-height:1.2}
.sname small{display:block;font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:800}
.sname em{display:block;font-style:normal;font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbtn{flex:0 0 auto;height:34px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--btn);font-weight:800;font-size:12px}
.sbtn:active{background:var(--btnOn)}
.smsg{min-height:16px;margin-top:10px;font-size:12px;color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hl"><div class="brand">STACK<span>FALL</span></div><div class="conf">AD-FREE</div></div>
    <div class="hr">
      <button class="iconbtn" id="bFs" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="iconbtn" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
    </div>
  </header>

  <div id="play">
    <div id="boardWrap"><canvas id="board"></canvas><div id="pop"></div></div>
    <div id="side">
      <div class="card"><div class="label">Next</div>
        <canvas class="mini big" id="n0"></canvas><canvas class="mini" id="n1"></canvas><canvas class="mini" id="n2"></canvas></div>
      <div class="card tap" id="holdCard"><div class="label">Hold</div><canvas class="mini" id="hc"></canvas></div>
      <div class="card"><div class="label">Score</div><div class="stat" id="sScore">0</div></div>
      <div class="card"><div class="label">Lines</div><div class="stat" id="sLines">0</div></div>
      <div class="card"><div class="label">Level</div><div class="stat" id="sLevel">1</div></div>
    </div>
  </div>

  <div id="controls">
    <div class="pad">
      <button class="btn" id="bL" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="btn" id="bD" aria-label="Soft drop"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
      <button class="btn" id="bR" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="pad">
      <button class="btn" id="bCCW" aria-label="Rotate left"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9L4 8.5"/><path d="M4 3.5v5h5"/></svg></button>
      <button class="btn" id="bCW" aria-label="Rotate right"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9L20 8.5"/><path d="M20 3.5v5h-5"/></svg></button>
      <button class="btn hard" id="bHard" aria-label="Hard drop"><svg viewBox="0 0 24 24"><path d="M6 5l6 6 6-6M6 11l6 6 6-6M5 20h14"/></svg></button>
    </div>
  </div>
</div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileIn" accept="audio/*" hidden>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
var COLS=10, ROWS=22, HIDDEN=2, VIS=ROWS-HIDDEN;
var LOCK_MS=500, MAX_RESETS=15, CLEAR_MS=220, DAS=160, ARR=45;
var COLORS={I:'#FF7A6B',O:'#7AE3C3',T:'#FFC857',S:'#6FA8FF',Z:'#C58BFF',J:'#FF8FC7',L:'#B6E36A'};
var BASE={
  I:[4,[[0,1],[1,1],[2,1],[3,1]]], O:[2,[[0,0],[1,0],[0,1],[1,1]]],
  T:[3,[[1,0],[0,1],[1,1],[2,1]]], S:[3,[[1,0],[2,0],[0,1],[1,1]]],
  Z:[3,[[0,0],[1,0],[1,1],[2,1]]], J:[3,[[0,0],[0,1],[1,1],[2,1]]],
  L:[3,[[2,0],[0,1],[1,1],[2,1]]]
};
var TYPES=Object.keys(BASE);
var ROT={};
TYPES.forEach(function(t){
  var n=BASE[t][0], c=BASE[t][1]; ROT[t]=[];
  for(var r=0;r<4;r++){ ROT[t].push(c); c=c.map(function(p){return [n-1-p[1],p[0]];}); }
});
// Wall kicks (y-up, standard tables); applied as (x+kx, y-ky)
var K_JLSTZ={'01':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'10':[[0,0],[1,0],[1,-1],[0,2],[1,2]],
  '12':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'21':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
  '23':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],'32':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
  '30':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'03':[[0,0],[1,0],[1,1],[0,-2],[1,-2]]};
var K_I={'01':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'10':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
  '12':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],'21':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
  '23':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'32':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
  '30':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],'03':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]};

/* ---------- storage (local only) ---------- */
var store={
  get:function(k,d){try{var v=localStorage.getItem('stackfall.'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem('stackfall.'+k,JSON.stringify(v));}catch(e){}}
};
var settings={ghost:true,haptics:true,sound:true};
var saved=store.get('settings',{}); for(var k in saved) if(k in settings) settings[k]=!!saved[k];
var best=store.get('best',0)||0;

/* ---------- DOM ---------- */
function $(id){return document.getElementById(id);}
var cv=$('board'), ctx=cv.getContext('2d'), play=$('play'), side=$('side'), wrap=$('boardWrap');
var overlay=$('overlay'), sheet=$('sheet'), popEl=$('pop');
var minis=[$('n0'),$('n1'),$('n2')], holdCv=$('hc');

/* ---------- state ---------- */
var state='menu', prevState='playing';
var board=emptyBoard(), cur=null, bag=[], queue=[], hold=null, holdUsed=false;
var score=0, lines=0, level=1, combo=-1, b2b=false, isNewBest=false;
var gravAcc=0, lockTimer=0, resets=0, softDrop=false, clearRows=[], clearTimer=0;
var cell=24, dpr=1, cache={}, bgCanvas=null, dirtyUI=true;

function emptyBoard(){var b=[];for(var y=0;y<ROWS;y++){b.push(new Array(COLS).fill(null));}return b;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fillQueue(){while(queue.length<5){if(!bag.length)bag=shuffle(TYPES.slice());queue.push(bag.pop());}}
function fits(t,r,x,y){
  var c=ROT[t][r];
  for(var i=0;i<4;i++){var nx=x+c[i][0], ny=y+c[i][1];
    if(nx<0||nx>=COLS||ny>=ROWS) return false;
    if(ny>=0&&board[ny][nx]) return false;}
  return true;
}
function gravityMs(){var l=Math.min(level,20);return Math.max(16,Math.pow(0.8-(l-1)*0.007,l-1)*1000);}

/* ---------- game flow ---------- */
function newGame(){
  board=emptyBoard(); bag=[]; queue=[]; hold=null; holdUsed=false;
  score=0; lines=0; level=1; combo=-1; b2b=false; isNewBest=false; softDrop=false; clearRows=[];
  fillQueue(); state='playing'; hideOverlay(); spawn(); dirtyUI=true; danger();
  last=performance.now(); reqWake(); guardBack();
}
function spawn(type){
  var t=type||queue.shift(); fillQueue();
  cur={type:t,rot:0,x:t==='O'?4:3,y:1};
  if(!fits(t,0,cur.x,cur.y)){ cur.y=0; if(!fits(t,0,cur.x,0)){ cur=null; gameOver(); return false; } }
  cur.lowest=cur.y; lockTimer=0; resets=0; gravAcc=0; dirtyUI=true; return true;
}
function nextPiece(){holdUsed=false; spawn();}
function canAct(){return state==='playing'&&cur;}
function fell(){if(cur.y>cur.lowest){cur.lowest=cur.y;resets=0;lockTimer=0;}}
function afterMove(){if(!fits(cur.type,cur.rot,cur.x,cur.y+1)&&resets<MAX_RESETS){lockTimer=0;resets++;}}
function move(dx){
  if(!canAct())return false;
  if(fits(cur.type,cur.rot,cur.x+dx,cur.y)){cur.x+=dx;afterMove();sfx('move');return true;}
  return false;
}
function softStep(){
  if(!canAct())return false;
  if(fits(cur.type,cur.rot,cur.x,cur.y+1)){cur.y++;score+=1;gravAcc=0;fell();return true;}
  return false;
}
function rotate(dir){
  if(!canAct())return false;
  var from=cur.rot, to=(from+dir+4)%4;
  if(cur.type==='O'){cur.rot=to;return true;}
  var kicks=(cur.type==='I'?K_I:K_JLSTZ)[''+from+to];
  for(var i=0;i<kicks.length;i++){
    var nx=cur.x+kicks[i][0], ny=cur.y-kicks[i][1];
    if(fits(cur.type,to,nx,ny)){cur.x=nx;cur.y=ny;cur.rot=to;fell();afterMove();sfx('rotate');buzz(4);return true;}
  }
  return false;
}
function hardDrop(){
  if(!canAct())return;
  var d=0; while(fits(cur.type,cur.rot,cur.x,cur.y+1)){cur.y++;d++;}
  score+=2*d; sfx('drop'); buzz(14);
  wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
  lockPiece();
}
function doHold(){
  if(!canAct()||holdUsed)return;
  var t=cur.type;
  if(hold){var h=hold;hold=t;spawn(h);}else{hold=t;spawn();}
  holdUsed=true; sfx('hold'); buzz(6); dirtyUI=true;
}
function lockPiece(){
  var c=ROT[cur.type][cur.rot], above=true;
  for(var i=0;i<4;i++){var x=cur.x+c[i][0], y=cur.y+c[i][1]; if(y>=0)board[y][x]=cur.type; if(y>=HIDDEN)above=false;}
  cur=null;
  if(above){gameOver();return;}
  var full=[]; for(var y=0;y<ROWS;y++){if(board[y].every(Boolean))full.push(y);}
  var n=full.length;
  if(n){
    combo++;
    var pts=[0,100,300,500,800][n]*level;
    if(n===4&&b2b)pts=Math.floor(pts*1.5);
    var wasB2B=(n===4&&b2b); b2b=(n===4);
    if(combo>0)pts+=50*combo*level;
    score+=pts; lines+=n;
    var nl=1+Math.floor(lines/10), lvlUp=nl>level; level=nl;
    var names=['','Single','Double','Triple','Quad!'];
    var mi=memeIndex(level), subs=[];
    if(wasB2B)subs.push('Back-to-back'); if(combo>0)subs.push('Combo ×'+combo);
    if(lvlUp)subs.push('Level '+level+' · '+MEMES[mi].emoji+' '+MEMES[mi].name);
    pop(names[n],subs.join(' · '));
    clearRows=full; clearTimer=CLEAR_MS; state='clearing';
    playMeme(mi); if(n===4)sfx('sparkle');
    buzz(n===4?[22,40,22]:16);
  }else{
    combo=-1; sfx('lock'); buzz(5); nextPiece();
  }
  dirtyUI=true; danger();
}
function finishClear(){
  board=board.filter(function(_,i){return clearRows.indexOf(i)<0;});
  while(board.length<ROWS)board.unshift(new Array(COLS).fill(null));
  clearRows=[]; state='playing'; nextPiece(); danger();
}
function danger(){
  var top=ROWS; for(var y=0;y<ROWS;y++){if(board[y].some(Boolean)){top=y;break;}}
  wrap.classList.toggle('danger',top<HIDDEN+4);
}
function gameOver(){
  state='over'; softDrop=false;
  if(score>best){best=score;store.set('best',best);isNewBest=score>0;}
  sfx('over'); buzz([40,60,90]); relWake(); showOverlay('over');
}
function pause(){
  if(state!=='playing'&&state!=='clearing')return;
  prevState=state; state='paused'; softDrop=false; relWake(); showOverlay('pause');
}
function resume(){
  if(state!=='paused')return;
  state=prevState; hideOverlay(); last=performance.now(); reqWake();
}

/* ---------- update / render ---------- */
function update(dt){
  if(state==='clearing'){clearTimer-=dt; if(clearTimer<=0)finishClear(); return;}
  if(state!=='playing'||!cur)return;
  var g=softDrop?Math.max(8,Math.min(gravityMs()/20,50)):gravityMs();
  gravAcc+=dt;
  while(gravAcc>=g){
    gravAcc-=g;
    if(fits(cur.type,cur.rot,cur.x,cur.y+1)){cur.y++;if(softDrop)score+=1;fell();}
    else{gravAcc=0;break;}
  }
  if(!fits(cur.type,cur.rot,cur.x,cur.y+1)){lockTimer+=dt; if(lockTimer>=LOCK_MS)lockPiece();}
  else lockTimer=0;
}

function hex(c){return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)];}
function mix(c,w,a){var h=hex(c),t=w?255:0;return 'rgb('+h.map(function(v){return Math.round(v+(t-v)*a);}).join(',')+')';}
function rr(c,x,y,w,h,r){w=Math.max(0,w);h=Math.max(0,h);r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function blockImg(t,size,ghost){
  var key=t+'|'+size+'|'+(ghost?1:0);
  if(cache[key])return cache[key];

function memeIndex(lv){return (lv-1)%MEMES.length;}

// Pre-render every sound once at start-up so playback is cheap and all sounds are similarly loud.
var memeBufs=[], memeRendered=0;
function renderMemes(){
  var OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext; if(!OAC)return;
  MEMES.forEach(function(m,i){
    try{
      var sr=44100, oc=new OAC(1,Math.ceil(sr*(m.dur+0.3)),sr), prevAc=ac, prevN=noiseBuf;
      ac=oc; noiseBuf=makeNoise(oc);
      m.fn(0.02,oc.destination);
      ac=prevAc; noiseBuf=prevN;
      var done=function(buf){normalize(buf);memeBufs[i]=buf;memeRendered++;};
      var p=oc.startRendering(); if(p&&p.then)p.then(done).catch(function(){}); else oc.oncomplete=function(ev){done(ev.renderedBuffer);};
    }catch(e){ac=null;}
  });
}
function normalize(buf){
  var d=buf.getChannelData(0), n=d.length, w=Math.floor(buf.sampleRate*0.05), peak=0, maxRms=0, i, j;
  for(i=0;i<n;i++){var a=Math.abs(d[i]);if(a>peak)peak=a;}
  for(i=0;i+w<=n;i+=w>>1){var s=0;for(j=i;j<i+w;j++)s+=d[j]*d[j];var r=Math.sqrt(s/w);if(r>maxRms)maxRms=r;}
  if(!peak||!maxRms)return;
  var k=Math.min(0.24/maxRms,0.92/peak);
  for(i=0;i<n;i++)d[i]*=k;
  var fade=Math.min(n,Math.floor(buf.sampleRate*0.02));for(i=0;i<fade;i++)d[n-1-i]*=i/fade;
}

// Your own clips (kept on this phone only, in IndexedDB)
var CLIP_MAX=3, customRaw={}, customBuf={}, idb=null;
function openDB(cb){
  try{var r=indexedDB.open('stackfall',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('clips');};
    r.onsuccess=function(){idb=r.result;cb();}; r.onerror=function(){cb();};
  }catch(e){cb();}
}
function dbPut(k,v){try{idb.transaction('clips','readwrite').objectStore('clips').put(v,k);}catch(e){}}
function dbDel(k){try{idb.transaction('clips','readwrite').objectStore('clips').delete(k);}catch(e){}}
function dbLoad(cb){
  if(!idb){cb();return;}
  try{var req=idb.transaction('clips','readonly').objectStore('clips').openCursor();
    req.onsuccess=function(){var c=req.result;if(c){customRaw[c.key]=c.value;c.continue();}else cb();};
    req.onerror=function(){cb();};
  }catch(e){cb();}
}
function decodeClip(data,ok,bad){
  try{var p=actx.decodeAudioData(data.slice(0),ok,bad); if(p&&p.catch)p.catch(function(){});}catch(e){bad();}
}
function decodeAllCustom(){
  if(!actx)return;
  Object.keys(customRaw).forEach(function(k){
    if(customBuf[k]||!customRaw[k]||!customRaw[k].data)return;
    decodeClip(customRaw[k].data,function(b){customBuf[k]=b;},function(){});
  });
}

var memeBus=null;
function playMeme(i,force){
  if(!actx||(!settings.sound&&!force))return;
  var t=actx.currentTime+0.01;
  if(memeBus){var old=memeBus;
    try{old.gain.cancelScheduledValues(t);old.gain.setValueAtTime(old.gain.value,t);old.gain.linearRampToValueAtTime(0,t+0.06);}catch(e){}
    setTimeout(function(){try{old.disconnect();}catch(e){}},400);}
  var bus=actx.createGain(); bus.gain.value=1; bus.connect(master); memeBus=bus;
  var buf=customBuf[i]||memeBufs[i];
  if(buf){
    var s=actx.createBufferSource(); s.buffer=buf; s.connect(bus); s.start(t);
    if(customBuf[i]){s.stop(t+CLIP_MAX); bus.gain.setValueAtTime(1,t+CLIP_MAX-0.2); bus.gain.linearRampToValueAtTime(0,t+CLIP_MAX);}
  }else{ // not rendered yet: build it live
    bus.gain.value=0.5; ac=actx; noiseBuf=noiseBuf||makeNoise(actx);
    try{MEMES[i].fn(t,bus);}catch(e){}
  }
}

/* ---------- touch gestures on the play area ---------- */
var gs=null;
play.addEventListener('pointerdown',function(e){
  if(state!=='playing'&&state!=='clearing')return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var now=performance.now();
  gs={id:e.pointerId,x0:e.clientX,y0:e.clientY,ax:e.clientX,ay:e.clientY,t0:now,axis:null,moved:false,held:false,samples:[[now,e.clientY]]};
  try{play.setPointerCapture(e.pointerId);}catch(_){}
});
play.addEventListener('pointermove',function(e){
  if(!gs||e.pointerId!==gs.id)return;
  var now=performance.now(); gs.samples.push([now,e.clientY]); if(gs.samples.length>10)gs.samples.shift();
  if(state!=='playing')return;
  var step=Math.max(14,cell*0.9), tdx=e.clientX-gs.x0, tdy=e.clientY-gs.y0, d;
  if(!gs.axis){
    if(Math.abs(tdx)>=step*0.6&&Math.abs(tdx)>Math.abs(tdy))gs.axis='h';
    else if(Math.abs(tdy)>=step*0.6)gs.axis='v';
  }
  if(gs.axis==='h'){
    d=e.clientX-gs.ax;
    while(d>=step){move(1);gs.ax+=step;d-=step;gs.moved=true;}
    while(d<=-step){move(-1);gs.ax-=step;d+=step;gs.moved=true;}
  }else if(gs.axis==='v'){
    d=e.clientY-gs.ay;
    while(d>=step){softStep();gs.ay+=step;d-=step;gs.moved=true;}
    if(!gs.held&&tdy<-step*2.2){doHold();gs.held=true;gs.moved=true;}
  }
});
play.addEventListener('pointerup',function(e){
  if(!gs||e.pointerId!==gs.id)return;
  var g=gs; gs=null; if(state!=='playing')return;
  var now=performance.now(), dt=now-g.t0, tdx=e.clientX-g.x0, tdy=e.clientY-g.y0;
  if(!g.moved&&dt<350&&Math.sqrt(tdx*tdx+tdy*tdy)<14){rotate(1);return;}
  if(g.axis==='v'&&tdy>0){
    var s0=g.samples[0];
    for(var i=0;i<g.samples.length;i++){if(now-g.samples[i][0]<=90){s0=g.samples[i];break;}}
    var vy=(e.clientY-s0[1])/Math.max(1,now-s0[0]);
    if(vy>0.9&&tdy>cell*1.2)hardDrop();
  }
});

  el.addEventListener('pointerdown',function(e){
    e.preventDefault(); e.stopPropagation();

    active=true; el.classList.add('on'); onDown();
    if(repeat){t1=setTimeout(function(){t2=setInterval(onDown,ARR);},DAS);}
  });
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end); el.addEventListener('lostpointercapture',end);
}

window.addEventListener('keydown',function(e){
  var k=e.key;
  if(state==='menu'||state==='over'){if(k==='Enter'){e.preventDefault();initAudio();newGame();}return;}
  if(k==='p'||k==='P'||k==='Escape'){e.preventDefault();if(state==='paused')resume();else pause();return;}
  if(state!=='playing')return;
  switch(k){
    case 'ArrowLeft':move(-1);break;
    case 'ArrowRight':move(1);break;
    case 'ArrowDown':softDrop=true;if(!e.repeat)softStep();break;
    case 'ArrowUp':case 'x':case 'X':if(!e.repeat)rotate(1);break;
    case 'z':case 'Z':if(!e.repeat)rotate(-1);break;
    case ' ':if(!e.repeat)hardDrop();break;
    case 'c':case 'C':case 'Shift':doHold();break;
    default:return;
  }
  e.preventDefault();
});
